function englishFor(text){
  const t=String(text).trim();if(UI_EN[t])return UI_EN[t];
  const rules=[
    [/^今天完成 (\d+) 场$/,m=>`${m[1]} ${m[1]==='1'?'match':'matches'} completed today`],
    [/^(\d+) 块场地$/,m=>`${m[1]} ${m[1]==='1'?'court':'courts'}`],
    [/^(选择|继续) (\d+) 块场地$/,m=>`${m[1]==='选择'?'Select':'Continue with'} ${m[2]} ${m[2]==='1'?'court':'courts'}`],
    [/^体验(单场|双场)演示 ↗$/,m=>`Try ${m[1]==='单场'?'one court':'two courts'} ↗`],
    [/^体验(单场|双场)球局？$/,m=>`Try a ${m[1]==='单场'?'single-court':'two-court'} demo?`],
    [/^(\d+) 人同时上场$/,m=>`${m[1]} players on court`],
    [/^(\d+) 人已签到$/,m=>`${m[1]} checked in`],
    [/^(.+) 今日签到$/,m=>`${m[1]}: check in today`],
    [/^(.+) · (\d+) 人已签到 · 记录已保留$/,m=>`${m[1]} · ${m[2]} checked in · Records saved`],
    [/^(单场|双场)球局$/,m=>`${m[1]==='单场'?'Single-court':'Two-court'} session`],
    [/^(\d+) 号场地$/,m=>`Court ${m[1]}`],[/^(\d+) 号场$/,m=>`Court ${m[1]}`],
    [/^场地 (\d+) ([AB]) 队比分$/,m=>`Court ${m[1]} Team ${m[2]} score`],
    [/^已打 (\d+) 场$/,m=>`${m[1]} played`],
    [/^(\d+) 人等候$/,m=>`${m[1]} waiting`],
    [/^(\d+) 人均摊$/,m=>`Split between ${m[1]}`],
    [/^(\d+) 人在场$/,m=>`${m[1]} on court`],
    [/^(\d+) 人$/,m=>`${m[1]} ${m[1]==='1'?'player':'players'}`],[/^(\d+) 场$/,m=>`${m[1]} ${m[1]==='1'?'game':'games'}`],[/^场$/,()=> 'played'],
    [/^(\d+) 分钟$/,m=>`${m[1]} min`],[/^已等$/,()=> 'Waited'],
    [/^第 (\d+) 位 · 等待$/,m=>`No. ${m[1]} · Waiting`],
    [/^● 场地 (\d+)$/,m=>`● Court ${m[1]}`],
    [/^(\d{2}:\d{2}) 开始 · 左 A 队 \/ 右 B 队$/,m=>`Started ${m[1]} · A left / B right`],
    [/^还有 (\d+) 人 ·$/,m=>`${m[1]} more ·`],
    [/^还有 (\d+) 人 · 查看全部球员$/,m=>`${m[1]} more · View all players`],
    [/^(\d{4}-\d{2}-\d{2}) · 场地 (\d+) · (\d{2}:\d{2})( · 今日)?$/,m=>`${m[1]} · Court ${m[2]} · ${m[3]}${m[4]?' · Today':''}`],
    [/^场地 (\d+)$/,m=>`Court ${m[1]}`],
    [/^共 (\d+) 场 · 最近 50 场$/,m=>`${m[1]} matches · Latest 50`],
    [/^(\d+) 胜 \/ (\d+) 负 · 今日 (\d+) 场$/,m=>`${m[1]} wins / ${m[2]} losses · ${m[3]} today`],
    [/^(.+) · 最近 5 场$/,m=>`${m[1]} · Last 5 matches`],
    [/^每人四舍五入到两位小数后，合计(多|少) RM ([\d.]+)，收款文案会注明。$/,m=>`Rounded to two decimals. Total is RM ${m[2]} ${m[1]==='多'?'over':'under'}; the message includes this. `],
    [/^(.+) 正在操作 · 你正在观看$/,m=>`${m[1]} is editing · You are viewing`],
    [/^(.+) 正在操作$/,m=>`${m[1]} is editing`],
    [/^· 每 5 秒同步$/,()=> '· Syncs every 5 seconds'],
    [/^已登录：(.+)$/,m=>`Signed in: ${m[1]}`],
    [/^(.+) · 断开后约 90 秒自动释放$/,m=>`${englishFor(m[1])||m[1]} · Released about 90 seconds after disconnecting`],
    [/^· 断开后约 90 秒自动释放$/,()=> '· Released about 90 seconds after disconnecting'],
    [/^将 (.+) 从球员库移除，历史战绩会保留。$/,m=>`Remove ${m[1]} from the player list. Match history will be kept.`],
    [/^将 (.+) 从球员名单删除。历史战绩和积分会保留，可在“已删除”中恢复。$/,m=>`Delete ${m[1]} from the player list. Ratings and results are kept; restore them under Deleted.`],
    [/^再加 (\d+) 人$/,m=>`Add ${m[1]} more`],
    [/^删除 (.+)？战绩保留，可恢复。$/,m=>`Delete ${m[1]}? Keep results; restore any time.`],
    [/^已添加 (\d+) 位球员$/,m=>`${m[1]} players added`],
    [/^已删除 (\d+)$/,m=>`Deleted ${m[1]}`],
    [/^请填写(.+)$/,m=>`Enter ${UI_EN[m[1]]||m[1]}.`],
    [/^(.+)须为 0～(\d+) 之间的数字$/,m=>`${UI_EN[m[1]]||m[1]} must be between 0 and ${m[2]}.`],
    [/^连接失败 \((\d+)\)$/,m=>`Connection failed (${m[1]}).`]
  ];
  for(const [pattern,format]of rules){const match=t.match(pattern);if(match)return format(match).trim();}
  const sentences=t.match(/[^。！？]+[。！？]?/g)||[];
  if(sentences.length>1){const translated=sentences.map(s=>englishFor(s.trim()));if(translated.every(Boolean))return translated.join(' ');}
  return null;
}
function bilingualText(text){const original=String(text??'');const en=englishFor(original);return en?`${original} / ${en}`:original;}

  const headers={'Content-Type':'application/json',apikey:config.supabaseKey};

async function refreshAuth(){
  if(refreshPromise)return refreshPromise;
  const key=authKey();
  const refresh=async()=>{
    Core.assert(authKey()===key,'登录状态已更改，请重新操作');
    syncAuth();Core.assert(auth,'登录状态已更改，请重新操作');
    // Another page may have refreshed while this page waited for the lock.
    if(auth.expires_at*1000>=Date.now()+60000)return;
    const token=auth.refresh_token;
    try{
      const r=await api('/auth/v1/token?grant_type=refresh_token',{refresh_token:token},false);
      // Never revive a signed-out session or replace a newer sign-in.
      Core.assert(authKey()===key&&getStored(key,null)?.refresh_token===token,'登录状态已更改，请重新操作');
      auth={...r,expires_at:r.expires_at||Date.now()/1000+r.expires_in};putStored(key,auth);
    }catch(e){
      if((e.status===400||e.status===401)&&getStored(key,null)?.refresh_token===token)localStorage.removeItem(key);
      syncAuth();editable=false;throw e;
    }
  };
  refreshPromise=(async()=>{
    try{if(navigator.locks)await navigator.locks.request(`courtside.auth.refresh.${key}`,refresh);else await refresh();}
    finally{refreshPromise=null;}
  })();return refreshPromise;
}

  Core.validate(r.state);state=r.state;version=r.version;online=true;cloudCanEdit=r.can_edit;roomOwner=r.is_owner;editorLabel=r.holder_label||'';
  editable=Boolean(r.editable);leaseUntil=editable?Date.now()+Math.max(0,new Date(r.lease_until)-new Date(r.server_time)-2000):0;

    // Remember only verified links so the installed PWA reopens this session.
    putStored(CONFIG_KEY,config);
    putStored(`courtside.cache.${config.supabaseUrl}.${config.room}`,{state,version});
  }catch{/* Cloud writes remain successful even when local storage is full. */}
}

    if(a==='new-session')confirmation('开启新球局？','当前签到与费用将归档；长期积分和所有比赛记录会保留。请先完成正在进行的比赛。',()=>mutate(s=>Core.reset(s,'羽球友谊局'),'新球局已开启'));
    if(a==='player-history')playerHistory(b.dataset.player);
    if(a==='correct'){const m=state.history.find(m=>m.id===b.dataset.match);modal('修改比赛比分',`<p class="help-text" style="margin:0 0 15px">${matchNames(m.a)} vs ${matchNames(m.b)}<br>保存后将按时间顺序重算后续 Elo，今日场次保持不变。</p><form data-form="correct" data-match="${m.id}"><div class="fields"><div class="field"><label for="correct-a">A 队比分</label><input id="correct-a" name="a" type="number" min="0" max="999" step="1" required value="${m.scoreA}"></div><div class="field"><label for="correct-b">B 队比分</label><input id="correct-b" name="b" type="number" min="0" max="999" step="1" required value="${m.scoreB}"></div></div><div class="dialog-actions"><button class="primary" type="submit">保存并重算积分</button></div></form>`);}
    if(a==='venue-mode'||a==='shuttle-mode'){const current=feeValues($('#fee-form'));const key=a==='venue-mode'?'venueMode':'shuttleMode';current[key]=b.dataset.mode;await mutate(s=>s.today.fees=current,'计费方式已保存');for(const k of [...drafts.keys()])if(k.startsWith('fee-'))drafts.delete(k);render();}
    if(a==='copy-receipt'){Core.assert(![...drafts.keys()].some(k=>k.startsWith('fee-')),'费用有未保存的修改，请先保存再复制');await copy(Core.receipt(state));}
    if(a==='logout'){if(editable&&isCloud())await release();auth=null;localStorage.removeItem(authKey());cloudCanEdit=false;roomOwner=false;cloudModal();await refreshCloud();}
    if(a==='create-room'||a==='create-empty-room')await createRoom(a==='create-empty-room');
    if(a==='local-mode'){if(editable)await release();config={...config,room:'',view:''};putStored(CONFIG_KEY,config);snapshotGeneration++;history.replaceState(null,'',location.pathname+location.search);editable=false;state=Core.empty();loadLocal();await acquireLocal();closeModal();render();}
    if(a==='export'){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),link=document.createElement('a');link.href=URL.createObjectURL(blob);link.download=`courtside-${state.today.date}.json`;link.click();setTimeout(()=>URL.revokeObjectURL(link.href),1000);}
    if(a==='import'){const file=document.createElement('input');file.type='file';file.accept='.json,application/json';file.onchange=async()=>{try{Core.assert(file.files[0].size<=10*1024*1024,'备份文件不能超过 10 MB');const data=Core.validate(JSON.parse(await file.files[0].text()));Core.fees(data);confirmation('导入备份？','将替换当前球局全部记录。建议先导出当前数据作为备份。',()=>mutate(s=>Object.assign(s,data),'备份已导入'));}catch(e){toast(friendly(e),true);}};file.click();}
    if(a==='archive'){const old=state.archives.find(x=>x.id===b.dataset.session),snapshot={...state,today:old};modal(`${old.date} · ${old.title}`,`<pre class="receipt-preview">${esc(Core.receipt(snapshot))}</pre><p class="help-text">历史账单快照，不受当前签到与费用影响。</p>`);}
  }catch(e){toast(friendly(e),true);if($('#modal').open&&$('#dialog-error'))$('#dialog-error').textContent=friendly(e);}
});
document.addEventListener('change',async e=>{
  const el=e.target;
  try{
    if(el.dataset.checkin)await mutate(s=>Core.checkin(s,el.dataset.checkin,el.checked),'签到名单已保存');
    if(el.hasAttribute('data-fee-toggle')){const current=feeValues($('#fee-form'));await mutate(s=>s.today.fees=current,'用球计费方式已保存');}
  }catch(e){toast(friendly(e),true);render();}
});
document.addEventListener('input',e=>{
  const el=e.target;if(el.dataset.draft)drafts.set(el.dataset.draft,el.value);
  if(el.id==='search-player'){search=el.value;const start=el.selectionStart,end=el.selectionEnd;const focusId=el.id;render();const next=document.getElementById(focusId);next.focus();next.setSelectionRange(start,end);}
  if(el.dataset.draft?.startsWith('fee-')){const feedback=$('#fee-feedback');if(feedback)feedback.textContent=bilingualText('有未保存的修改，复制文案前请先保存。');}
});
document.addEventListener('submit',async e=>{
  const form=e.target;if(!form.dataset.form)return;e.preventDefault();const d=new FormData(form),type=form.dataset.form,submit=form.querySelector('[type=submit]');if(submit)submit.disabled=true;
  try{
    if(type==='add'){let added;await mutate(s=>{added=Core.addMany(s,d.get('name'));if(d.get('checked')){const now=Date.now();for(const p of added)Core.checkin(s,p.id,true,now);}},'');showDeleted=false;search='';closeModal();render();toast(`已添加 ${added.length} 位球员`);}
    if(type==='rename-player'){await mutate(s=>Core.renamePlayer(s,form.dataset.player,d.get('name')),'球员姓名已更新');search='';closeModal();render();}
    if(type==='score'){Core.assert(d.get('scoreA')!==''&&d.get('scoreB')!=='','请输入双方比分');await mutate(s=>Core.settle(s,Number(form.dataset.court),form.dataset.match,Number(d.get('scoreA')),Number(d.get('scoreB'))),'比分已结算，今日次数与天梯已更新');drafts.delete(`a-${form.dataset.match}`);drafts.delete(`b-${form.dataset.match}`);}
    if(type==='correct'){await mutate(s=>Core.correct(s,form.dataset.match,Number(d.get('a')),Number(d.get('b'))),'比分已修改，天梯已重算');closeModal();}
    if(type==='fees'){const f=feeValues(form);await mutate(s=>s.today.fees=f,'费用与收款信息已保存');for(const k of [...drafts.keys()])if(k.startsWith('fee-'))drafts.delete(k);render();}
    if(type==='session'){await mutate(s=>{s.today.title=String(d.get('title')).trim().slice(0,60)||'羽球友谊局';s.today.autoFill=Boolean(d.get('autoFill'));},'球局设置已保存');closeModal();}
    if(type==='cloud-config'){
      const next={...config,supabaseUrl:String(d.get('url')).trim().replace(/\/+$/,''),supabaseKey:String(d.get('key')).trim()};validateConfig(next);
      Core.assert(!isCloud()||next.supabaseUrl===config.supabaseUrl&&next.supabaseKey===config.supabaseKey,'请先返回本机模式，再切换云端项目');
      config=next;putStored(CONFIG_KEY,config);auth=getStored(authKey(),null);cloudModal();toast('连接配置已保存');
    }
    if(type==='login'){Core.assert(!isCloud()||!editable,'请先交出当前操作权');const r=await api('/auth/v1/token?grant_type=password',{email:String(d.get('email')).trim(),password:d.get('password')},false);auth={...r,expires_at:r.expires_at||Date.now()/1000+r.expires_in};putStored(authKey(),auth);if(isCloud())await refreshCloud(true);cloudModal();toast('已登录，可以创建或接手球局');}
    if(type==='grant-editor'){await rpc('grant_editor',{p_room:config.room,p_email:String(d.get('email')).trim()});toast('已授权，对方登录后可接手操作');form.reset();}
  }catch(e){toast(friendly(e),true);const error=$('#dialog-error');if($('#modal').open&&error)error.textContent=friendly(e);}
  finally{if(submit?.isConnected)submit.disabled=false;}
});
window.addEventListener('storage',e=>{
  if(e.key===LOCAL_KEY&&!isCloud()&&!busy){loadLocal();render();}
  if(e.key===authKey()||e.key===null){syncAuth();snapshotGeneration++;render();}
});
window.addEventListener('online',()=>{if(isCloud())refreshCloud();});
window.addEventListener('offline',()=>{if(isCloud()){online=false;editable=false;render();}});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&isCloud())refreshCloud();});
window.addEventListener('pagehide',()=>{if(!isCloud()||!editable||!auth)return;const headers={'Content-Type':'application/json',apikey:config.supabaseKey,Authorization:`Bearer ${auth.access_token}`};fetch(config.supabaseUrl+'/rest/v1/rpc/court_release',{method:'POST',headers,body:JSON.stringify({p_room:config.room,p_device:device}),keepalive:true}).catch(()=>{});});
setInterval(()=>{for(const el of document.querySelectorAll('[data-wait]')){const p=Core.player(state,el.dataset.wait);if(p){el.textContent=waitingText(p);translateUI(el);}}if(isCloud()&&editable&&Date.now()>=leaseUntil){editable=false;render();}},1000);
setInterval(()=>refreshCloud(),5000);
let renewing=false;
setInterval(async()=>{if(!isCloud()||!editable||busy||!online||renewing)return;renewing=true;const gen=snapshotGeneration;try{const r=await rpc('renew',{p_room:config.room,p_device:device});if(gen===snapshotGeneration&&editable)applySnapshot(r);}catch{if(gen===snapshotGeneration){editable=false;online=false;render();}}finally{renewing=false;}},20000);
async function init(){
  if(isCloud()){const cached=getStored(`courtside.cache.${config.supabaseUrl}.${config.room}`,null);if(cached){try{state=Core.validate(cached.state);version=cached.version;}catch{}}editable=false;online=false;render();try{await refreshCloud(true);}catch(e){toast(friendly(e),true);}}
  else{loadLocal();render();try{await acquireLocal();}catch(e){toast(friendly(e),true);}}
}
init();
if('serviceWorker' in navigator&&location.protocol!=='file:'){
  window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
}
}
</script>
</body>
</html>
